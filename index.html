<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Gustavo Vasconcelos — Desenvolvedor Full Stack</title>

    <meta
      name="description"
      content="Portfólio de Gustavo Vasconcelos, Desenvolvedor Full Stack. Projetos, experimentos e estudos em desenvolvimento web e engenharia de software."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9fafb" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Gustavo Vasconcelos" />
    <meta
      property="og:title"
      content="Gustavo Vasconcelos — Desenvolvedor Full Stack"
    />
    <meta
      property="og:description"
      content="Projetos, experimentos e estudos em desenvolvimento web e engenharia de software."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Gustavo Vasconcelos — Desenvolvedor Full Stack"
    />
    <meta
      name="twitter:description"
      content="Projetos, experimentos e estudos em desenvolvimento web e engenharia de software."
    />

    <script>
      (() => {
        let stored = null;

        try {
          stored = localStorage.getItem("theme");
        } catch {
          // Storage can be unavailable in private browsing modes.
        }

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark = stored === "dark" || (stored !== "light" && prefersDark);

        document.documentElement.classList.toggle("dark", isDark);

        // Keep the browser UI color in sync with the resolved theme,
        // including when the stored choice differs from the OS preference.
        const themeColor = isDark ? "#0c0f11" : "#f9fafb";

        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach((meta) => meta.setAttribute("content", themeColor));

        // Temporarily disable CSS transitions on initial load
        // to prevent unwanted animations during first paint
        document.documentElement.classList.add("no-transition");

        window.addEventListener(
          "load",
          () => {
            document.documentElement.classList.remove("no-transition");
          },
          { once: true },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
