<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Gustavo Vasconcelos — Desenvolvedor Full Stack</title>

    <meta
      name="description"
      content="Portfólio de Gustavo Vasconcelos, Desenvolvedor Full Stack. Projetos, experimentos e estudos em desenvolvimento web e engenharia de software."
    />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Gustavo Vasconcelos" />
    <meta
      property="og:title"
      content="Gustavo Vasconcelos — Desenvolvedor Full Stack"
    />
    <meta
      property="og:description"
      content="Projetos, experimentos e estudos em desenvolvimento web e engenharia de software."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Gustavo Vasconcelos — Desenvolvedor Full Stack"
    />
    <meta
      name="twitter:description"
      content="Projetos, experimentos e estudos em desenvolvimento web e engenharia de software."
    />

    <script>
      (() => {
        let stored = null;

        try {
          stored = localStorage.getItem("theme");
        } catch {
          // Storage can be unavailable in private browsing modes.
        }

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark = stored === "dark" || (stored !== "light" && prefersDark);

        document.documentElement.classList.toggle("dark", isDark);

        // Meta's in-app browsers ship a custom WebView whose compositor can
        // flash the page while a full-viewport background animates, so the
        // theme switches instantly there. Regular browsers keep the fade.
        if (/Instagram|FBAN|FBAV|FB_IAB|; wv\)/i.test(navigator.userAgent)) {
          document.documentElement.classList.add("in-app-browser");
        }

        // Temporarily disable CSS transitions on initial load
        // to prevent unwanted animations during first paint
        document.documentElement.classList.add("no-transition");

        window.addEventListener(
          "load",
          () => {
            document.documentElement.classList.remove("no-transition");
          },
          { once: true },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
